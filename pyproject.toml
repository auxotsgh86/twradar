[project]
name = "twradar"
version = "0.2.0.dev6"
description = "台股右側加碼雷達：盤後籌碼爬取、SQLite 儲存、訊號分析、Web API 與 UI"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
dependencies = []          # 只用 Python 標準函式庫
[project.optional-dependencies]
certs = ["certifi"]        # macOS 的 Python 若缺根憑證時使用
[project.scripts]
twradar = "twradar.cli:main"
